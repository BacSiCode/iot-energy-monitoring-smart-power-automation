<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IoT 55 Smart Retail</title>
  <style>
    :root {
      --bg: #edf2f5;
      --panel: #ffffff;
      --panel-alt: #f5f7f9;
      --line: #d7dee4;
      --text: #17212b;
      --muted: #64717c;
      --ok: #2b8a5b;
      --warn: #c65a2f;
      --blue: #2d6cdf;
      --shadow: 0 2px 8px rgba(23,33,43,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 24px; }
    .muted { color: var(--muted); font-size: 13px; }
    .status-pill {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 8px 12px;
      border-radius: 999px;
      background: #dfeaf8;
      color: var(--blue);
      border: 1px solid #bfd0ef;
    }
    .status-pill.offline {
      background: #fbe8df;
      color: var(--warn);
      border-color: #f0c2aa;
    }
    .status-pill.online {
      background: #eaf9f1;
      color: var(--ok);
      border-color: #bfe7d0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .panel h3 {
      margin: 0 0 12px;
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .value {
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 800;
      line-height: 1.2;
      margin-top: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel.chart-panel {
      padding: 14px 16px 8px;
      margin-top: 14px;
    }
    .chart-box {
      width: 100%;
      height: 180px;
      border-radius: 8px;
      background: linear-gradient(180deg, #f8fafb, #eef2f5);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .chart-box svg { display:block; width:100%; height:100%; }
    .toolbar {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      box-shadow: var(--shadow);
      flex: 1;
    }
    .control-group input {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 120px;
      font-size: 14px;
      background: #fafcfd;
    }
    button {
      border: 1px solid #bfd0ef;
      background: #edf4ff;
      color: #183d7a;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, filter .08s ease;
    }
    button:hover { filter: brightness(.98); }
    button:active { transform: translateY(1px); }
    .primary { background: #2d6cdf; color: white; border-color: #2d6cdf; }
    .danger { background: #fff0ee; color: #b14a2d; border-color: #efb5a5; }
    .success { background: #eafaf2; color: var(--ok); border-color: #bfe7d0; }
    .warning { background: #fff6e9; color: #a25e11; border-color: #f0d99d; }
    .events {
      margin-top: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .events-list {
      margin: 0;
      padding-left: 18px;
      max-height: 220px;
      overflow: auto;
      color: var(--text);
    }
    .events-list li {
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.4;
    }
    .empty { color: var(--muted); font-size: 14px; }
    .ok { color: var(--ok); }
    .alert { color: var(--warn); }
    @media (max-width: 800px) {
      .grid { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>IoT 55 | Giám sát điện năng</h1>
        <div class="muted">Smart Retail Power Automation · device01</div>
      </div>
      <div id="connection" class="status-pill offline">Offline</div>
    </header>

    <section class="grid">
      <div class="panel">
        <h3>Current signal</h3>
        <div class="value" id="current">-</div>
      </div>
      <div class="panel">
        <h3>Presence</h3>
        <div class="value" id="presence">-</div>
      </div>
      <div class="panel">
        <h3>Store</h3>
        <div class="value" id="store">-</div>
      </div>
      <div class="panel">
        <h3>Relay</h3>
        <div class="value" id="relay">-</div>
      </div>
      <div class="panel">
        <h3>Mode</h3>
        <div class="value" id="mode">-</div>
      </div>
      <div class="panel">
        <h3>System state</h3>
        <div class="value" id="state">-</div>
      </div>
      <div class="panel">
        <h3>Threshold</h3>
        <div class="value" id="threshold">-</div>
      </div>
      <div class="panel">
        <h3>Last telemetry</h3>
        <div class="value" id="last">-</div>
      </div>
    </section>

    <div class="panel chart-panel">
      <h3>Current history (last 20 readings)</h3>
      <div class="chart-box"><svg id="chart" viewBox="0 0 700 180" preserveAspectRatio="none"></svg></div>
    </div>

    <div class="toolbar">
      <div class="control-group">
        <button class="success" onclick="command('ON')">Relay ON</button>
        <button class="danger" onclick="command('OFF')">Relay OFF</button>
        <button class="primary" onclick="command('AUTO')">AUTO</button>
        <button class="warning" onclick="command('OVERRIDE')">OVERRIDE</button>
        <button onclick="command('CLEAR_OVERRIDE')">Clear override</button>
      </div>
      <div class="control-group">
        <input id="thresholdInput" type="number" min="1" step="10" placeholder="700" aria-label="Threshold" />
        <button class="primary" onclick="setThreshold()">Set threshold</button>
      </div>
    </div>

    <section class="events">
      <h3>Latest events</h3>
      <ul id="eventsList" class="events-list"><li class="empty">No events</li></ul>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function formatTime(value) {
      if (!value) return '-';
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? '-' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function renderHistory(history) {
      const values = (history || []).map(item => Number(item.value ?? 0)).filter(v => Number.isFinite(v));
      const safe = values.length ? values : [0];
      const max = Math.max(...safe, 1);
      const min = Math.min(...safe, 0);
      const svg = $('chart');
      if (!svg) return;

      const width = 700;
      const height = 180;
      const pad = 18;
      const step = values.length > 1 ? (width - pad * 2) / (values.length - 1) : 0;
      const points = values.map((v, idx) => {
        const x = pad + idx * step;
        const y = height - pad - ((v - min) / Math.max(max - min, 1)) * (height - pad * 2);
        return `${x},${y}`;
      }).join(' ');

      svg.innerHTML = `
        <defs>
          <linearGradient id="curveFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#6ea4ff" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#6ea4ff" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <path d="M 18 162 L ${points.split(' ').join(' L ')} L 682 162 Z" fill="url(#curveFill)" opacity="0.9"></path>
        <polyline fill="none" stroke="#2d6cdf" stroke-width="3" points="${points}" stroke-linecap="round" stroke-linejoin="round"></polyline>
      `;
    }

    function renderEvents(events) {
      const list = $('eventsList');
      if (!list) return;
      const items = (events || []).slice(0, 10);
      if (!items.length) {
        list.innerHTML = '<li class="empty">No events</li>';
        return;
      }
      list.innerHTML = items.map(item => {
        const stamp = formatTime(item.timestamp_ms);
        const type = item.event_type || item.type || 'EVENT';
        const desc = item.description || item.detail || 'Event';
        return `<li><strong>${stamp}</strong> · ${type} · ${desc}</li>`;
      }).join('');
    }

    async function refresh() {
      try {
        const response = await fetch('/api/state');
        if (!response.ok) throw new Error('API error');
        const s = await response.json();
        const online = Boolean(s.online);
        const conn = $('connection');
        conn.textContent = online ? 'Online' : 'Offline';
        conn.className = online ? 'status-pill online' : 'status-pill offline';

        $('current').textContent = s.currentSignal ?? '-';
        $('presence').textContent = s.presence ? 'PRESENT' : 'NONE';
        $('store').textContent = s.storeStatus || '-';
        $('relay').textContent = s.relay ? 'ON' : 'OFF';
        $('mode').textContent = s.override ? 'OVERRIDE' : (s.mode || '-');
        $('state').textContent = s.systemState || '-';
        $('threshold').textContent = s.threshold ?? '-';
        $('last').textContent = formatTime(s.lastTelemetry);
        $('thresholdInput').value = s.threshold ?? '';

        const events = Array.isArray(s.events) ? s.events : [];
        renderEvents(events);
        renderHistory(Array.isArray(s.history) ? s.history : []);
      } catch (error) {
        $('connection').textContent = 'Offline';
        $('connection').className = 'status-pill offline';
        $('current').textContent = '-';
        $('presence').textContent = 'NONE';
        $('store').textContent = '-';
        $('relay').textContent = 'OFF';
        $('mode').textContent = '-';
        $('state').textContent = 'OFFLINE';
        $('threshold').textContent = '-';
        $('last').textContent = '-';
        $('eventsList').innerHTML = '<li class="empty">No events</li>';
      }
    }

    async function command(value) {
      try {
        await fetch('/api/command', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ command: value })
        });
      } catch (error) {
        // no-op, UI will re-render on next refresh
      }
      setTimeout(refresh, 300);
    }

    async function setThreshold() {
      const value = Number($('thresholdInput').value);
      if (!Number.isFinite(value) || value <= 0) {
        alert('Threshold must be a positive number.');
        return;
      }
      await fetch('/api/command', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ command: 'SET_THRESHOLD', value })
      });
      setTimeout(refresh, 300);
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
