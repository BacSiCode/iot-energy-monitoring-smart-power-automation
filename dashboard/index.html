<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IoT 55 Smart Retail</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #17212b; background: #eef2f5; }
    body { margin: 0; } main { max-width: 1100px; margin: auto; padding: 24px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px; }
    h1 { margin:0; font-size:24px; } .muted { color:#64717c; font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .panel { background:white; border:1px solid #d7dee4; border-radius:8px; padding:16px; box-shadow:0 2px 8px #17212b0b; }
    .label { color:#64717c; font-size:12px; text-transform:uppercase; letter-spacing:.05em; } .value { font-size:25px; font-weight:700; margin-top:8px; }
    .wide { margin-top:12px; } .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    button { border:1px solid #b9c5ce; background:#f8fafb; color:#17212b; border-radius:5px; padding:9px 14px; cursor:pointer; }
    button:hover { background:#e8f0f5; } .alert { color:#a33b27; font-weight:700; } .ok { color:#28784b; } pre { white-space:pre-wrap; max-height:260px; overflow:auto; margin:0; font-size:12px; }
    @media (max-width:700px) { .grid { grid-template-columns:repeat(2,1fr); } header { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body><main>
  <header><div><h1>IoT 55 | Giám sát điện năng</h1><div class="muted">Smart Retail Power Automation · device01</div></div><strong id="connection">Đang kết nối</strong></header>
  <section class="grid">
    <div class="panel"><div class="label">Current signal</div><div class="value" id="current">-</div></div>
    <div class="panel"><div class="label">Presence</div><div class="value" id="presence">-</div></div>
    <div class="panel"><div class="label">Store</div><div class="value" id="store">-</div></div>
    <div class="panel"><div class="label">Relay</div><div class="value" id="relay">-</div></div>
    <div class="panel"><div class="label">Mode</div><div class="value" id="mode">-</div></div>
    <div class="panel"><div class="label">System state</div><div class="value" id="state">-</div></div>
    <div class="panel"><div class="label">Threshold</div><div class="value" id="threshold">-</div></div>
    <div class="panel"><div class="label">Last telemetry</div><div class="value" id="last">-</div></div>
  </section>
  <section class="panel wide"><div class="label">Remote control</div><div class="controls">
    <button onclick="command('ON')">Relay ON</button><button onclick="command('OFF')">Relay OFF</button><button onclick="command('AUTO')">AUTO</button><button onclick="command('OVERRIDE')">OVERRIDE</button><button onclick="command('CLEAR_OVERRIDE')">Clear override</button>
  </div><p class="muted">Commands are validated by Node-RED before publication.</p></section>
  <section class="panel wide"><div class="label">Latest events</div><pre id="events">No events</pre></section>
</main>
<script>
const $ = id => document.getElementById(id);
async function refresh() { try { const response = await fetch('/api/state'); if (!response.ok) throw Error(); const s = await response.json(); $('connection').textContent = s.online ? 'ONLINE' : 'OFFLINE'; $('connection').className = s.online ? 'ok' : 'alert'; $('current').textContent = s.currentSignal ?? '-'; $('presence').textContent = s.presence ? 'PRESENT' : 'NONE'; $('store').textContent = s.storeStatus || '-'; $('relay').textContent = s.relay ? 'ON' : 'OFF'; $('mode').textContent = s.override ? 'OVERRIDE' : (s.mode || '-'); $('state').textContent = s.systemState || '-'; $('threshold').textContent = s.threshold ?? '-'; $('last').textContent = s.lastTelemetry ? new Date(s.lastTelemetry).toLocaleTimeString() : '-'; $('events').textContent = (s.events || []).map(e => `${new Date(e.timestamp_ms).toLocaleTimeString()}  ${e.event_type}  ${e.description}`).join('\n') || 'No events'; } catch (e) { $('connection').textContent = 'MIDDLEWARE OFFLINE'; $('connection').className = 'alert'; } }
async function command(value) { await fetch('/api/command', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({command:value}) }); setTimeout(refresh, 300); }
refresh(); setInterval(refresh, 2000);
</script>
</body></html>
