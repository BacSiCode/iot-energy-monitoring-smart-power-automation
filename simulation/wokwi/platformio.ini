; Wokwi build: compiles the SAME source as firmware/esp32 but forces the
; simulation defaults (Wokwi-GUEST Wi-Fi, public broker) and ignores config.h.
[platformio]
default_envs = esp32dev
src_dir = ../../firmware/esp32/src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D IOT55_SIMULATION
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
