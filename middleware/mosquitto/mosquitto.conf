# Mosquitto MQTT Broker Configuration
# IoT Project #55
# For local development only.
# Reference: https://mosquitto.org/man/mosquitto-conf-5.html

# ── Listener ────────────────────────────────────────
listener 1883
protocol mqtt

# WebSocket listener (for browser-based MQTT clients)
listener 9001
protocol websockets

# ── Authentication ──────────────────────────────────
# Set to false for local development (no auth)
# Set to true and configure password_file for production
allow_anonymous true
# password_file /etc/mosquitto/passwd

# ── Persistence ─────────────────────────────────────
persistence true
persistence_location /var/lib/mosquitto/

# ── Logging ─────────────────────────────────────────
log_dest stdout
log_type all
log_timestamp true

# ── Connection limits ────────────────────────────────
max_connections -1
max_keepalive 60

# ── QoS ─────────────────────────────────────────────
# QoS 1 and 2 messages stored if client disconnects
max_queued_messages 100
