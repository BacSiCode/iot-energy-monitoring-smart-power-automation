# Mosquitto configuration - IoT Project 55 (local development).
# Reference: https://mosquitto.org/man/mosquitto-conf-5.html

listener 1883
protocol mqtt

# WebSocket listener for browser-based MQTT tools
listener 9001
protocol websockets

# --- Authentication ----------------------------------------------------------
# Development: anonymous access on a private LAN.
# Production / shared network: create a password file and disable anonymous:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd iot55
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
# (mount ./middleware/mosquitto/passwd, which is gitignored)
# TLS (optional enhancement): add a listener 8883 with cafile/certfile/keyfile.
allow_anonymous true

# --- Persistence (retained status / relay state / cmd/mode / cmd/threshold) ---
persistence true
persistence_location /mosquitto/data/

# --- Logging -----------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

max_keepalive 60
max_queued_messages 100
