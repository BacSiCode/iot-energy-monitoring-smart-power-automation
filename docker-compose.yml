services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot55-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./middleware/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  nodered:
    image: nodered/node-red:latest
    container_name: iot55-nodered
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "1880:1880"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      STORE_OPEN_TIME: ${STORE_OPEN_TIME:-08:00}
      STORE_CLOSE_TIME: ${STORE_CLOSE_TIME:-22:00}
      AUTO_SHUTDOWN_DELAY_SECONDS: ${AUTO_SHUTDOWN_DELAY_SECONDS:-60}
    volumes:
      - ./middleware/node-red:/data

  dashboard:
    image: nginx:alpine
    container_name: iot55-dashboard
    restart: unless-stopped
    depends_on:
      - nodered
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mosquitto-data:
  mosquitto-log:
